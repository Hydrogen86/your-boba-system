<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/order-page.css">

</head>
<body>
    <main>
        <div class="menu-container">

            <div class="item">
                <img src="../assets/images/milk-tea_example.jpg" alt="example-image">

                <div class="details-box">
                    <p class="item-flavor">Chocolate Fudge</p>
                    <p>₱100.00</p>

                    <div class="item__select-details">
                        <!-- Sugar Level -->
                        <select id="sugar-level">
                            <option value="">Sugar Level</option>
                            <option value="0">0%</option>
                            <option value="30">30%</option>
                            <option value="50">50%</option>
                            <option value="70">70%</option>
                            <option value="100">100%</option>
                        </select>

                        <!-- Size -->
                        <select id="size">
                            <option value="">Size</option>
                            <option value="50oz">50oz</option>
                            <option value="80">80z</option>
                            <option value="120">120z</option>
                        </select>

                        <!-- Adds-on -->
                        <select id="adds-on">
                            <option value="">Adds-on</option>
                            <option value="marshmallow">Marsmallow</option>
                            <option value="kisses">Kisses</option>
                            <option value="springkler">Springkler</option>
                        </select>

                        <!-- Type -->
                        <select id="order-type">
                            <option value="">Order Type</option>
                            <option value="dine in">Dine in</option>
                            <option value="take out">Take Out</option>
                        </select>

                        <!-- Table Number -->
                        <select id="table-number">
                            <option value="">Table Number</option>
                            <option value="A1">A1</option>
                            <option value="A2">A2</option>
                            <option value="A3">A3</option>
                            <option value="B1">B1</option>
                            <option value="B2">B2</option>
                            <option value="B3">B3</option>
                        </select>
                    </div>

                </div>
            </div>

            <div class="item">
                <img src="../assets/images/milk-tea_example-two.jpg" alt="example-image">

                <div class="details-box">
                    <p class="item-flavor">Strawberry Cake</p>
                    <p>₱100.00</p>

                    <div class="item__select-details">
                        <!-- Sugar Level -->
                        <select id="sugar-level">
                            <option value="">Sugar Level</option>
                            <option value="0">0%</option>
                            <option value="30">30%</option>
                            <option value="50">50%</option>
                            <option value="70">70%</option>
                            <option value="100">100%</option>
                        </select>

                        <!-- Size -->
                        <select id="size">
                            <option value="">Size</option>
                            <option value="50oz">50oz</option>
                            <option value="80">80z</option>
                            <option value="120">120z</option>
                        </select>

                        <!-- Adds-on -->
                        <select id="adds-on">
                            <option value="">Adds-on</option>
                            <option value="marshmallow">Marsmallow</option>
                            <option value="kisses">Kisses</option>
                            <option value="springkler">Springkler</option>
                        </select>

                        <!-- Type -->
                        <select id="order-type">
                            <option value="">Order Type</option>
                            <option value="dine in">Dine in</option>
                            <option value="take out">Take Out</option>
                        </select>

                        <!-- Table Number -->
                        <select id="table-number">
                            <option value="">Table Number</option>
                            <option value="A1">A1</option>
                            <option value="A2">A2</option>
                            <option value="A3">A3</option>
                            <option value="B1">B1</option>
                            <option value="B2">B2</option>
                            <option value="B3">B3</option>
                        </select>
                    </div>

                </div>
            </div>

        </div>
    </main>
</body>
</html>
